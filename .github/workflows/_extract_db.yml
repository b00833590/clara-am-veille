name: (temporaire) Extraire la base du cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offres-db-state
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restaurer la base de données depuis le cache
        uses: actions/cache/restore@v4
        with:
          path: data/offres.db
          key: offres-db-${{ github.run_id }}
          restore-keys: |
            offres-db-

      - uses: actions/upload-artifact@v4
        with:
          name: offres-db-snapshot
          path: data/offres.db
          retention-days: 1
